name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install "ruff>=0.5"
      - name: Ruff (style and common errors)
        run: ruff check .

  test:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt pytest-cov
      - name: Unit, validation, experiment and results tests
        run: pytest -q --cov --cov-report=term

  reference-environment:
    # The exact versions that produced the published results.
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-lock.txt
      - run: python -m cuneus validate --report /tmp/VALIDATION.md
      - run: python -m cuneus manifest
      - run: python -m cuneus check
      - name: Smoke run of every experiment
        run: python -m cuneus run all --quick
